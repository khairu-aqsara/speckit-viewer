version: 2

project_name: speckit

builds:
  - main: .
    binary: speckit
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: speckit
    package_name: speckit
    vendor: khairu-aqsara
    homepage: "https://github.com/khairu-aqsara/speckit-viewer"
    maintainer: "Khairu Aqsara <wenkhairu@gmail.com>"
    description: "A two-pane terminal dashboard for GitHub Spec Kit projects"
    formats: [deb, rpm]
    bindir: /usr/bin

changelog:
  use: git

brews:
  - repository:
      owner: khairu-aqsara
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/khairu-aqsara/speckit-viewer"
    description: "A two-pane terminal dashboard for GitHub Spec Kit projects"
    install: |
      bin.install "speckit"
    test: |
      system "#{bin}/speckit", "--version"
